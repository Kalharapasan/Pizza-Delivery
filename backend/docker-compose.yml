services:
  mysql:
    image: mysql:8.0
    container_name: pizza_delivery_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pizza_delivery
      MYSQL_USER: pizza
      MYSQL_PASSWORD: pizzapass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - pizza_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: pizza_delivery_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  pizza_mysql_data:
